services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_foundation
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: local-development-only
    ports: ["55432:5432"]
    volumes: ["foundation_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_foundation"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build:
      context: ..
      dockerfile: database/Dockerfile
    environment:
      ERP_DATABASE_URL: postgresql+psycopg://erp:local-development-only@db:5432/erp_foundation
    volumes: ["../out_repaired:/data:ro"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  foundation_data:
